name: API Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/app/api/**'
      - 'src/lib/**'
      - 'tests/**'
      - 'vitest.config.ts'
      - 'package.json'
  pull_request:
    branches: [main]
  # Scheduled daily run at 6am UTC
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  CI: true
  NODE_ENV: test

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run API tests
        run: pnpm test --coverage
        env:
          # Test environment variables (from vitest.config.ts)
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          CLERK_SECRET_KEY: test-clerk-secret
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: test-clerk-publishable
          SCANNER_JWT_SECRET: test-scanner-jwt-secret
          RESEND_API_KEY: re_test_key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from the coverage summary
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
            echo "Line coverage: ${COVERAGE}%"

            # Fail if coverage is below 50% (starting threshold, increase over time)
            THRESHOLD=50
            if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
              echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
              exit 1
            else
              echo "::notice::Coverage ${COVERAGE}% meets the ${THRESHOLD}% threshold"
            fi
          else
            echo "::warning::Coverage report not found"
          fi
