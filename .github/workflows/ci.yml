name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true
  NODE_ENV: test
  PNPM_VERSION: 9

jobs:
  # ─── Version Consistency Check ───
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          echo "### 🔖 Version Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get version from package.json
          PKG_VERSION=$(jq -r '.version' package.json)
          echo "📦 package.json version: $PKG_VERSION"
          echo "- **package.json**: \`$PKG_VERSION\`" >> $GITHUB_STEP_SUMMARY

          # Get latest version from HISTORY.md (first ## X.X.X pattern)
          # Using grep -E for extended regex (portable)
          HISTORY_VERSION=$(grep -E '^## [0-9]+\.[0-9]+\.[0-9]+' HISTORY.md | head -1 | sed 's/## //' | sed 's/ .*//')
          echo "📜 HISTORY.md version: $HISTORY_VERSION"
          echo "- **HISTORY.md**: \`$HISTORY_VERSION\`" >> $GITHUB_STEP_SUMMARY

          # Check if APP_VERSION references package.json (dynamic) or is hardcoded
          if grep -q 'require.*package.json.*version' src/lib/constants.ts 2>/dev/null; then
            echo "✅ APP_VERSION: dynamically linked to package.json"
            echo "- **constants.ts**: ✅ Linked to package.json" >> $GITHUB_STEP_SUMMARY
          elif [ -f src/lib/constants.ts ]; then
            # Check for hardcoded version
            CONST_VERSION=$(grep -E "APP_VERSION\s*=\s*['\"][0-9]+\.[0-9]+\.[0-9]+" src/lib/constants.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1 || echo "")
            if [ -n "$CONST_VERSION" ]; then
              echo "📋 constants.ts version: $CONST_VERSION"
              echo "- **constants.ts**: \`$CONST_VERSION\`" >> $GITHUB_STEP_SUMMARY
              if [ "$CONST_VERSION" != "$PKG_VERSION" ]; then
                echo "❌ ERROR: constants.ts version ($CONST_VERSION) does not match package.json ($PKG_VERSION)"
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "❌ **FAILED**: constants.ts version mismatch!" >> $GITHUB_STEP_SUMMARY
                exit 1
              fi
            fi
          fi

          echo ""

          # Compare versions
          if [ -z "$HISTORY_VERSION" ]; then
            echo "❌ ERROR: Could not find version in HISTORY.md"
            echo "   Expected format: ## X.Y.Z (YYYY-MM-DD)"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **FAILED**: No version found in HISTORY.md" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "$PKG_VERSION" != "$HISTORY_VERSION" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "   package.json: $PKG_VERSION"
            echo "   HISTORY.md:   $HISTORY_VERSION"
            echo ""
            echo "Please ensure HISTORY.md has an entry for version $PKG_VERSION"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **FAILED**: HISTORY.md needs entry for version \`$PKG_VERSION\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All versions match: $PKG_VERSION"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All versions match!**" >> $GITHUB_STEP_SUMMARY

  # ─── Lint & Type Check ───
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: rm -f pnpm-workspace.yaml && pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

  # ─── Unit & API Tests ───
  unit-tests:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: afters_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d afters_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: rm -f pnpm-workspace.yaml && pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create disposable ticket concurrency schema
        run: pnpm exec prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/afters_test

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          AFTERS_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/afters_test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-a-runtime-credential
          SCANNER_JWT_SECRET: test-scanner-jwt-secret
          RESEND_API_KEY: re_test_key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            LINES=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
            FUNCS=$(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')
            BRANCHES=$(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')
            STMTS=$(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')
            
            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STMTS}% |" >> $GITHUB_STEP_SUMMARY
          fi

  # ─── Build Check ───
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: rm -f pnpm-workspace.yaml && pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          # Minimal env vars for build
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-a-runtime-credential
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1
