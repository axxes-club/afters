name: E2E Tests

on:
  # Only run on PRs to main (not on every push)
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

env:
  CI: true
  PLAYWRIGHT_BASE_URL: http://localhost:3000

jobs:
  check-secrets:
    name: Check Required Secrets
    runs-on: ubuntu-latest
    outputs:
      secrets-available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check if required secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ] && [ -n "${{ secrets.CLERK_SECRET_KEY_TEST }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Required secrets are configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Required secrets not configured - E2E tests will be skipped"
            echo "Please configure the following secrets in repository settings:"
            echo "  - DATABASE_URL"
            echo "  - CLERK_SECRET_KEY_TEST"
            echo "  - CLERK_PUBLISHABLE_KEY_TEST"
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.secrets-available == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium
        env:
          # Clerk test credentials
          CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}

          # Neon test branch
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # App secrets
          E2E_AUTH_BYPASS_TOKEN: ${{ secrets.E2E_AUTH_BYPASS_TOKEN }}
          SCANNER_JWT_SECRET: test-scanner-secret

          # Stripe (test mode)
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}

          # Feature flags
          ENABLE_AUTH_IN_DEV: 'true'
          NODE_ENV: test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

  skip-notice:
    name: E2E Tests (Skipped)
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.secrets-available != 'true'
    steps:
      - name: Notice
        run: |
          echo "::warning::E2E tests skipped - required secrets not configured"
          echo "To enable E2E tests, configure the following repository secrets:"
          echo "  - DATABASE_URL"
          echo "  - CLERK_SECRET_KEY_TEST"
          echo "  - CLERK_PUBLISHABLE_KEY_TEST"
          echo "  - CLERK_TESTING_TOKEN (optional)"
          echo "  - NEON_API_KEY (optional)"
          echo "  - NEON_PROJECT_ID (optional)"
